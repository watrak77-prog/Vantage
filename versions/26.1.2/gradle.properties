# Loom decides obfuscation handling from which of its two plugin ids was
# applied: "net.fabricmc.fabric-loom" hardcodes unobfuscated mode, while the
# short "fabric-loom" id we use reads this property instead and otherwise
# assumes obfuscation. Setting it here also switches off dependency remapping,
# which Loom derives from the same flag.
fabric.loom.disableObfuscation=true
